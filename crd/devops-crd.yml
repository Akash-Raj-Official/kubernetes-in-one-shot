apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:  
  name: devopsbatches.akashraj.com
spec:  
  group: akashraj.com  
  scope: Namespaced  
  names:    
    plural: devopsbatches    
    singular: devopsbatch    
    kind: DevOpsBatch    
    shortNames:      
      - batches      
      - aks  
  versions:   
    - name: v1      
      served: true      
      storage: true      
      
      schema:        
        openAPIV3Schema:          
          type: object          
          properties:            
            spec:              
              type: object              
              properties:              
                name:                  
                  type: string                  
                  description: "This is the name of DevOps Batch"                
                duration:                  
                  type: string                  
                  description: "This is the duration of the batch"                
                mode:                  
                  type: string                  
                  description: "How the batch will run"                
                platform:                  
                  type: string                  
                  description: "This is the platform"
